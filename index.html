<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja de Mundos · Creador de universos para másters de rol</title>
<meta name="description" content="Crea, ajusta y exporta universos de rol coherentes con su guía del máster y gestor de campaña. Independiente de sistema.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8B%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap');
:root{--bg:#0b1020;--bg2:#121a33;--card:#0f1730;--line:#233056;--txt:#e8ecf8;--mut:#93a0c4;--teal:#2dd4bf;--teal2:#14b8a6;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--violet:#a78bfa;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 12% -10%,rgba(45,212,191,.16),transparent 60%),radial-gradient(800px 600px at 100% 10%,rgba(167,139,250,.14),transparent 60%),radial-gradient(900px 700px at 50% 120%,rgba(251,191,36,.10),transparent 60%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{filter:hue-rotate(25deg);transform:scale(1.06)}}
.runes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.runes i{position:absolute;bottom:-40px;font-style:normal;color:var(--teal);opacity:.0;font-size:22px;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.22}90%{opacity:.18}100%{transform:translateY(-110vh) rotate(60deg);opacity:0}}
@media (prefers-reduced-motion:reduce){body:before,.runes i,.card,.btn{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(11,16,32,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:800 22px Fraunces,Georgia,serif;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.logo b{color:var(--teal)}
.logo small{font:500 11px Inter;color:var(--mut);display:block;margin-top:-2px}
.tabs{display:flex;gap:4px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(15,23,48,.6)}
.tab{background:none;border:0;color:var(--mut);font:600 14px Inter;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}
.tab:hover{color:var(--txt)}
.tab.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#04201c;box-shadow:0 0 18px rgba(45,212,191,.35)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 90px}
.card{background:linear-gradient(180deg,rgba(18,26,51,.92),rgba(15,23,48,.92));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s,border-color .2s}
.card.hov{cursor:pointer}
.card.hov:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 22px rgba(45,212,191,.22)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--bg2);color:var(--txt);font:600 14px Inter;padding:9px 14px;border-radius:12px;cursor:pointer;transition:.15s;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#04201c;border:0;box-shadow:0 0 18px rgba(45,212,191,.3)}
.btn.amb{background:linear-gradient(135deg,var(--amber),#f59e0b);color:#2a1a00;border:0}
.btn.dan{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
input,select,textarea{width:100%;background:#0a1128;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:15px Inter,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.15)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px;letter-spacing:.02em}
input[type=range]{padding:0;accent-color:var(--teal);height:28px}
.mut{color:var(--mut)}.sm{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(45,212,191,.12);color:var(--teal);border:1px solid rgba(45,212,191,.3)}
.badge.a{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.3)}
.badge.r{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.3)}
.badge.v{background:rgba(167,139,250,.12);color:var(--violet);border-color:rgba(167,139,250,.3)}
.badge.g{background:rgba(74,222,128,.12);color:var(--green);border-color:rgba(74,222,128,.3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--mut);font:600 13px Inter;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--txt)}
.chip.on{background:rgba(45,212,191,.16);color:var(--teal);border-color:var(--teal)}
.h2{font-size:24px;margin:6px 0 4px}.h3{font-size:18px}
.sec{margin:22px 0 10px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;border-top:1px solid var(--line);border-bottom:0;background:rgba(11,16,32,.96);backdrop-filter:blur(10px);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.tab{padding:8px 11px;font-size:13px}.logo small{display:none}}
.slider{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.val{color:var(--amber);font-weight:700;font-size:13px}
.stage{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#0a1128;margin-bottom:8px}
.stage .st{margin-left:auto;font-size:13px;color:var(--mut)}
.stage.run{border-color:var(--teal);box-shadow:0 0 14px rgba(45,212,191,.3)}
.stage.err{border-color:var(--red)}
.stage input{width:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;background:linear-gradient(90deg,transparent,var(--teal),var(--amber),transparent);background-size:200% 100%;animation:bar 1.2s linear infinite;display:none}
.bar.on{display:block}
@keyframes bar{to{background-position:-200% 0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#0c1430;border-left:1px solid var(--line);z-index:50;transform:translateX(105%);transition:transform .25s;overflow-y:auto;padding:16px 16px 40px;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.scrim{position:fixed;inset:0;background:rgba(3,6,16,.6);z-index:45;display:none}
.scrim.on{display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#16224a;border:1px solid var(--teal);color:var(--txt);padding:10px 16px;border-radius:12px;z-index:80;opacity:0;transition:.25s;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.rel{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:13.5px}
.rel .x{margin-left:auto}
.link{color:var(--teal);cursor:pointer;text-decoration:underline dotted}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty .big{font-size:42px}
.tl{position:relative;margin-left:14px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-30px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.kan{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.kan{grid-template-columns:1fr 1fr}}@media(max-width:560px){.kan{grid-template-columns:1fr}}
.kcol{background:#0a1128;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.kcol h4{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.q:hover{border-color:var(--teal)}
.iss{border-left:4px solid var(--amber)}.iss.alta{border-left-color:var(--red)}.iss.baja{border-left-color:var(--violet)}
.sub{display:flex;gap:6px;margin:6px 0 14px}
pre.b{white-space:pre-wrap;font:inherit;margin:8px 0 0}
.lock{filter:drop-shadow(0 0 4px rgba(251,191,36,.6))}
.sw{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}.sw input{width:auto}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 16px 100px}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="runes" id="runes" aria-hidden="true"></div>
<header class="top">
  <div class="logo"><span style="font-size:26px">🌋</span><div>Forja de <b>Mundos</b><small>Universos de rol para el máster</small></div></div>
  <select id="projSel" style="width:auto;max-width:210px" aria-label="Universo"></select>
  <button class="btn sm" data-act="newProject">＋ Nuevo</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer>Forja de Mundos · tus datos se guardan solo en este navegador · exporta una copia JSON de vez en cuando</footer>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-label="Editor"></aside>
<div class="toast" id="toast"></div>
<script>
'use strict';
const PROXY = "https://gemini-proxy.francesc-adria-perello.workers.dev/";
const LS = 'forja.v1';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const str = v => Array.isArray(v) ? v.map(str).filter(Boolean).join(', ') : (v && typeof v === 'object') ? Object.values(v).map(str).filter(Boolean).join(' · ') : String(v == null ? '' : v).trim();

const TYPES = {
  mundo: { label: 'Mundo', plural: 'El mundo', icon: '🌍' },
  lugar: { label: 'Lugar', plural: 'Lugares', icon: '🗺️' },
  evento: { label: 'Evento histórico', plural: 'Historia y cronología', icon: '⏳' },
  faccion: { label: 'Facción', plural: 'Facciones', icon: '⚔️' },
  pnj: { label: 'PNJ', plural: 'Personajes (PNJ)', icon: '🎭' },
  cultura: { label: 'Cultura o religión', plural: 'Culturas y religiones', icon: '🏛️' },
  regla: { label: 'Regla de magia o tecnología', plural: 'Magia, tecnología y reglas', icon: '✨' },
  conflicto: { label: 'Conflicto', plural: 'Conflictos', icon: '🔥' },
  gancho: { label: 'Gancho de aventura', plural: 'Ganchos de aventura', icon: '🪝' },
  guia: { label: 'Sección de la guía', plural: 'Guía del máster', icon: '📖' }
};
const ORDER = ['mundo', 'lugar', 'cultura', 'regla', 'faccion', 'evento', 'pnj', 'conflicto', 'gancho', 'guia'];
const WORLD_TYPES = ORDER.filter(t => t !== 'guia' && t !== 'mundo');

// Esquemas JSON que se piden a la IA y cómo se convierten en elementos
const SPEC = {
  mundo: { schema: '{"nombre":"nombre del mundo/universo","lema":"frase corta que lo resume","descripcion":"4-6 frases: qué es este mundo, su atmósfera y su situación actual","principios":"3-4 rasgos que definen el mundo, separados por punto y coma","secreto":"el gran secreto del mundo, solo para el máster"}', body: [['descripcion', ''], ['principios', 'Principios del mundo']], tag: null, rel: [], list: null },
  lugar: { schema: '{"nombre":"","tipo":"ciudad|región|ruina|bosque|puerto|templo|...","resumen":"1-2 frases","descripcion":"3-5 frases: aspecto, ambiente, gente, qué se puede hacer allí","secreto":"verdad oculta solo para el máster","dentro_de":"nombre EXACTO de otro lugar existente o vacío","conexiones":[{"con":"nombre exacto de lugar/facción/PNJ existente","tipo":"limita con|comercia con|..."}]}', body: [['descripcion', '']], tag: 'tipo', rel: [['dentro_de', 'dentro de']], list: 'conexiones' },
  evento: { schema: '{"nombre":"","fecha_texto":"fecha en el calendario del mundo, p. ej. Año 312 de la Era del Sol","orden":0,"resumen":"1-2 frases","descripcion":"3-4 frases","consecuencias":"cómo marca el presente","secreto":"verdad oculta solo para el máster","participantes":["nombres exactos de facciones/PNJ/lugares existentes"]}', body: [['descripcion', ''], ['consecuencias', 'Consecuencias']], tag: null, rel: [['participantes', 'implica a']], list: null },
  faccion: { schema: '{"nombre":"","tipo":"gremio|reino|culto|ejército|familia|...","resumen":"1-2 frases","descripcion":"3-4 frases","objetivos":"","metodos":"","secreto":"agenda oculta solo para el máster","sede":"nombre exacto de un lugar existente","aliados":["nombres exactos de facciones existentes"],"rivales":["nombres exactos de facciones existentes"]}', body: [['descripcion', ''], ['objetivos', 'Objetivos'], ['metodos', 'Métodos']], tag: 'tipo', rel: [['sede', 'con sede en'], ['aliados', 'aliada de'], ['rivales', 'rival de']], list: null },
  pnj: { schema: '{"nombre":"","rol":"oficio o papel en el mundo","resumen":"1-2 frases","descripcion":"aspecto y manera de hablar","personalidad":"","motivacion":"","secreto":"verdad oculta solo para el máster","faccion":"nombre exacto de una facción existente o vacío","lugar":"nombre exacto de un lugar existente","relaciones":[{"con":"nombre exacto de otro PNJ/facción existente","tipo":"hermano de|deudor de|..."}]}', body: [['descripcion', ''], ['personalidad', 'Personalidad'], ['motivacion', 'Motivación']], tag: 'rol', rel: [['faccion', 'miembro de'], ['lugar', 'se encuentra en']], list: 'relaciones' },
  cultura: { schema: '{"nombre":"","tipo":"cultura|religión|tradición","resumen":"1-2 frases","descripcion":"3-4 frases","costumbres":"","creencias":"","secreto":"solo para el máster","donde":"nombre exacto de un lugar existente"}', body: [['descripcion', ''], ['costumbres', 'Costumbres'], ['creencias', 'Creencias']], tag: 'tipo', rel: [['donde', 'presente en']], list: null },
  regla: { schema: '{"nombre":"","categoria":"magia|tecnología|ley natural|economía","resumen":"1-2 frases","descripcion":"cómo funciona, 3-4 frases","limites":"qué NO puede hacerse","coste":"precio o riesgo de usarla","secreto":"solo para el máster"}', body: [['descripcion', ''], ['limites', 'Límites'], ['coste', 'Coste y riesgos']], tag: 'categoria', rel: [], list: null },
  conflicto: { schema: '{"nombre":"","resumen":"1-2 frases","descripcion":"3-4 frases","escalada":"cómo empeora si los jugadores no intervienen","secreto":"solo para el máster","bandos":["nombres exactos de facciones/PNJ existentes"]}', body: [['descripcion', ''], ['escalada', 'Si nadie interviene']], tag: null, rel: [['bandos', 'enfrenta a']], list: null },
  gancho: { schema: '{"nombre":"título sugerente","resumen":"1-2 frases","descripcion":"cómo empieza la aventura","complicacion":"giro o dificultad","recompensa":"","secreto":"verdad oculta solo para el máster","pnj_clave":"nombre exacto de un PNJ existente","lugar":"nombre exacto de un lugar existente","conflicto":"nombre exacto de un conflicto existente o vacío"}', body: [['descripcion', ''], ['complicacion', 'Complicación'], ['recompensa', 'Recompensa']], tag: null, rel: [['pnj_clave', 'implica a'], ['lugar', 'ocurre en'], ['conflicto', 'parte del conflicto']], list: null },
  guia: { schema: '{"titulo":"","contenido":"texto útil y práctico para el máster"}', body: [['contenido', '']], tag: null, rel: [], list: null }
};

const STAGES = [
  { id: 'mundo', type: 'mundo', n: 1, label: 'Visión general del mundo', ask: n => 'Crea la visión general del universo (1 elemento) a partir de la premisa y los ajustes.' },
  { id: 'lugar', type: 'lugar', n: 7, label: 'Geografía y lugares', ask: n => `Crea ${n} lugares variados (de escala acorde al ajuste) que formen una geografía coherente: algunos lugares dentro de otros, conexiones entre ellos y al menos un sitio peligroso o misterioso.` },
  { id: 'cultura', type: 'cultura', n: 3, label: 'Culturas y religiones', ask: n => `Crea ${n} culturas, pueblos o religiones, ligadas a lugares ya existentes.` },
  { id: 'regla', type: 'regla', n: 3, label: 'Magia, tecnología y reglas del mundo', ask: n => `Crea ${n} reglas fundamentales del mundo (magia, tecnología, ley natural o economía) con límites y costes claros, respetando los niveles de magia y tecnología.` },
  { id: 'faccion', type: 'faccion', n: 5, label: 'Facciones', ask: n => `Crea ${n} facciones con objetivos enfrentados, sedes en lugares existentes y alianzas o rivalidades entre ellas.` },
  { id: 'evento', type: 'evento', n: 7, label: 'Historia y cronología', ask: n => `Crea ${n} eventos históricos ordenados cronológicamente (campo "orden": número creciente, 1 el más antiguo) que expliquen cómo se llegó al presente. Usa un calendario propio del mundo y respétalo en todas las fechas.` },
  { id: 'pnj', type: 'pnj', n: 8, label: 'Personajes clave (PNJ)', ask: n => `Crea ${n} PNJ memorables y variados (aliados, villanos, ambiguos), vinculados a facciones y lugares existentes y entre sí.` },
  { id: 'conflicto', type: 'conflicto', n: 4, label: 'Conflictos', ask: n => `Crea ${n} conflictos activos entre facciones o fuerzas del mundo, que den motor a campañas.` },
  { id: 'gancho', type: 'gancho', n: 6, label: 'Ganchos de aventura', ask: n => `Crea ${n} ganchos de aventura listos para jugar, conectados a PNJ, lugares y conflictos existentes.` },
  { id: 'guia', type: 'guia', n: 7, label: 'Guía del máster', ask: n => 'Escribe la guía del máster de este universo en exactamente estas 7 secciones (campo "titulo"): "Cómo usar este universo", "Tono y estilo de narración", "Los secretos centrales y cómo desvelarlos", "Primera sesión sugerida", "Encuentros y tabla de rumores (d6)", "Nombres, vocabulario y detalles de ambiente", "Consejos para mantener la coherencia". Cada contenido debe usar nombres reales del canon y ser práctico (3-8 frases).' }
];

// ---------- estado ----------
let DB = { projects: [], currentId: null };
const ui = { tab: 'ajustes', sub: 'sesiones', filter: 'all', q: '', mode: 'cards', edit: null, busy: null, stageSt: {}, prev: {}, issuesBusy: false, qfilter: 'all' };
let saveT = null;
function load() { try { const d = JSON.parse(localStorage.getItem(LS)); if (d && Array.isArray(d.projects)) DB = d; } catch (e) { } if (!DB.projects.length) { DB.projects.push(newProject('Mi primer universo')); DB.currentId = DB.projects[0].id; } if (!cur()) DB.currentId = DB.projects[0].id; }
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
function saveNow() { try { cur().updated = Date.now(); localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) { toast('No se pudo guardar: el navegador no tiene espacio. Exporta un JSON.', 1); } }
const cur = () => DB.projects.find(p => p.id === DB.currentId);
function newProject(name) { return { id: uid(), name: name || 'Universo nuevo', created: Date.now(), updated: Date.now(), premise: '', ajustes: { tono: 50, magia: 50, tecnologia: 30, crudeza: 40, escala: 'región', temas: [], sistema: '', jugadores: '4', vetos: '' }, ents: [], sesiones: [], misiones: [], issues: [], ignored: [] }; }
const ent = id => cur().ents.find(e => e.id === id);
function addEnt(p, type, f) { const e = Object.assign({ id: uid(), type, name: 'Sin nombre', summary: '', body: '', secreto: '', tags: [], fecha: '', orden: 0, rels: [], locked: false, estado: '', notasCamp: '' }, f); p.ents.push(e); return e; }
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', err ? 5200 : 2600); }
function busy(on) { $('#bar').classList.toggle('on', !!on); }

// ---------- relaciones ----------
function findByName(p, name, selfId) {
  const n = norm(name); if (!n) return null;
  let c = p.ents.find(e => e.id !== selfId && norm(e.name) === n); if (c) return c;
  c = p.ents.find(e => e.id !== selfId && n.length > 3 && (norm(e.name).includes(n) || (norm(e.name).length > 3 && n.includes(norm(e.name)))));
  return c || null;
}
function resolveRels(p) { for (const e of p.ents) for (const r of e.rels) { if (!r.to || !p.ents.some(x => x.id === r.to)) { r.to = null; const t = findByName(p, r.name, e.id); if (t) { r.to = t.id; r.name = t.name; } } } }
function relName(p, r) { const t = r.to && p.ents.find(x => x.id === r.to); return t ? t.name : r.name; }
function relText(p, e) { return e.rels.map(r => (r.label ? r.label + ' ' : '') + relName(p, r)).join('; '); }
function addRel(e, name, label) { name = str(name); if (!name) return; if (e.rels.some(r => norm(r.name) === norm(name) && r.label === label)) return; e.rels.push({ to: null, name, label: label || 'relacionado con' }); }

function fromAI(type, o) {
  const sp = SPEC[type]; o = o || {};
  const e = { name: str(o.nombre || o.titulo) || 'Sin nombre', summary: str(o.resumen || o.lema), secreto: str(o.secreto), tags: [], rels: [] };
  e.body = sp.body.map(([k, l]) => { const v = str(o[k]); return v ? (l ? l + ': ' : '') + v : ''; }).filter(Boolean).join('\n\n');
  if (type === 'mundo' && !e.summary) e.summary = clip(str(o.descripcion), 200);
  if (type === 'guia') e.summary = clip(e.body, 140);
  if (sp.tag && o[sp.tag]) e.tags = [str(o[sp.tag])];
  if (type === 'evento') { e.fecha = str(o.fecha_texto || o.fecha); e.orden = Number(o.orden) || 0; }
  for (const [k, label] of sp.rel) [].concat(o[k] || []).forEach(v => addRel(e, v, label));
  if (sp.list && Array.isArray(o[sp.list])) o[sp.list].forEach(x => addRel(e, x && (x.con || x.nombre), x && x.tipo));
  return e;
}

// ---------- IA ----------
async function ai(system, user, temp) {
  const body = { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { temperature: temp == null ? 0.9 : temp, responseMimeType: 'application/json' } };
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 150000);
  let r, txt, d;
  for (let k = 0; k < 4; k++) {
    try { r = await fetch(PROXY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal }); }
    catch (e) { clearTimeout(tm); throw new Error(e.name === 'AbortError' ? 'La IA ha tardado demasiado. Inténtalo de nuevo.' : 'No se pudo contactar con la IA (¿sin conexión?). Puedes seguir editando a mano.'); }
    txt = await r.text(); d = null; try { d = JSON.parse(txt); } catch (e) { }
    const busyAI = r.status === 503 || r.status === 500 || (d && d.error && /high demand|overloaded|unavailable/i.test(String(d.error.message || d.error)));
    if (!busyAI || k === 3) break; await new Promise(res => setTimeout(res, 3000 * (k + 1)));
  }
  clearTimeout(tm);
  if (!d) throw new Error('Respuesta inesperada de la IA (código ' + r.status + ').');
  if (!r.ok || d.error) { const m = d.error && (d.error.message || d.error) || ''; if (r.status === 429 || /quota|exhaust|rate/i.test(String(m))) throw new Error('Se ha agotado la cuota gratuita de la IA por ahora. Prueba más tarde.'); if (r.status === 503 || /high demand/i.test(String(m))) throw new Error('La IA gratuita está saturada ahora mismo. Espera un minuto y reintenta.'); throw new Error('Error de la IA' + (m ? ': ' + clip(String(m), 140) : ' (código ' + r.status + ')') + '.'); }
  const out = ((d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || []).map(x => x.text || '').join('');
  if (!out) throw new Error('La IA no devolvió texto (quizá filtró el contenido). Reformula e inténtalo otra vez.');
  return out;
}
function parseJSON(t) { t = t.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim(); try { return JSON.parse(t); } catch (e) { const m = t.match(/[\[{][\s\S]*[\]}]/); if (m) return JSON.parse(m[0]); throw e; } }
async function aiJSON(sys, user, temp) { let last; for (let i = 0; i < 2; i++) { try { return parseJSON(await ai(sys, user, temp)); } catch (e) { last = e; if (!(e instanceof SyntaxError)) throw e; } } throw new Error('La IA devolvió un formato no válido. Inténtalo de nuevo.'); }

const band = (v, labels) => labels[Math.min(labels.length - 1, Math.floor(v / (100 / labels.length)))];
const L_TONO = ['muy sombrío y desesperanzado', 'oscuro y melancólico', 'equilibrado entre luces y sombras', 'aventurero y esperanzador', 'luminoso, heroico y épico'];
const L_MAGIA = ['sin magia (todo es mundano)', 'magia rarísima y dudosa', 'magia escasa y misteriosa', 'magia presente pero con reglas', 'magia omnipresente y espectacular'];
const L_TEC = ['edad de piedra o bronce', 'medieval', 'renacentista y de pólvora', 'industrial o de principios de la ciencia', 'futurista o espacial'];
const L_CRU = ['apto para todos los públicos', 'suave', 'moderadamente duro', 'crudo', 'muy crudo y adulto'];
function settingsText(p) {
  const a = p.ajustes;
  return `PREMISA DEL MÁSTER: ${p.premise || '(libre: inventa algo original)'}\nAJUSTES: tono ${band(a.tono, L_TONO)}; magia: ${band(a.magia, L_MAGIA)}; tecnología: ${band(a.tecnologia, L_TEC)}; crudeza: ${band(a.crudeza, L_CRU)}; escala: ${a.escala}; temas: ${a.temas.join(', ') || 'a elección'}; mesa de ${a.jugadores} jugadores${a.sistema ? '; sistema de juego habitual: ' + a.sistema + ' (sin usar estadísticas)' : ''}.${a.vetos ? '\nVETOS Y GUSTOS DE LA MESA (respétalos): ' + a.vetos : ''}`;
}
function sysBase() { return 'Eres un diseñador de mundos de rol de mesa y un máster veterano. Escribes en español de España, con prosa concreta y evocadora, sin relleno ni florituras vacías. Reglas: 1) Respeta estrictamente el CANON ya definido; no lo contradigas. 2) Los elementos marcados [BLOQUEADO] son intocables. 3) Cuando algo se relacione con un elemento existente, usa su nombre EXACTAMENTE igual; no crees duplicados ni cambies nombres. 4) Mantén coherentes geografía, calendario, nombres, reglas de magia/tecnología y relaciones entre elementos. 5) Sé independiente de sistema: no uses estadísticas ni reglas de un juego concreto. 6) Devuelve SOLO JSON válido, sin texto adicional.'; }
function digest(p, o) {
  o = o || {}; const rows = [];
  for (const t of ORDER) {
    const L = p.ents.filter(e => e.type === t && e.id !== o.exclude); if (!L.length) continue;
    rows.push('## ' + TYPES[t].plural.toUpperCase());
    for (const e of L) {
      let s = '- ' + e.name + (e.locked ? ' [BLOQUEADO]' : '') + (e.fecha ? ' (' + e.fecha + ')' : '') + ': ' + clip(e.summary, o.full ? 400 : 170);
      if (o.full) { s += ' | ' + clip(e.body, 700); if (e.secreto) s += ' | SECRETO: ' + clip(e.secreto, 300); }
      const r = relText(p, e); if (r) s += ' | Relaciones: ' + clip(r, 300);
      rows.push(s);
    }
  }
  return rows.join('\n') || '(aún vacío)';
}
const ctxHead = (p, o) => settingsText(p) + '\n\nCANON ACTUAL DEL UNIVERSO:\n' + digest(p, o);

function removeEnts(p, list) {
  const ids = new Set(list.map(e => e.id));
  for (const e of p.ents) for (const r of e.rels) if (r.to && ids.has(r.to)) { const t = p.ents.find(x => x.id === r.to); r.name = t.name; r.to = null; }
  p.ents = p.ents.filter(e => !ids.has(e.id));
  p.misiones.forEach(m => { if (ids.has(m.dador)) m.dador = ''; if (ids.has(m.lugar)) m.lugar = ''; });
  p.sesiones.forEach(s => s.ents = (s.ents || []).filter(i => !ids.has(i)));
}
async function genStage(p, st, extra) {
  const lockedN = p.ents.filter(e => e.type === st.type && e.locked).length;
  const n = Math.max(st.type === 'mundo' || st.type === 'guia' ? st.n : 2, st.n - lockedN);
  const user = `${ctxHead(p)}\n\nTAREA: ${st.ask(n)}${extra ? '\nINSTRUCCIÓN ADICIONAL DEL MÁSTER: ' + extra : ''}\n\nDevuelve un objeto JSON {"items":[ ... ]} con exactamente ${n} elemento(s). Cada elemento sigue este esquema (los textos largos van en texto plano, sin markdown):\n${SPEC[st.type].schema}`;
  const d = await aiJSON(sysBase(), user, 0.95);
  const items = Array.isArray(d) ? d : (d.items || d.elementos || Object.values(d).find(Array.isArray) || []);
  if (!items.length) throw new Error('La IA no devolvió elementos. Inténtalo de nuevo.');
  return items.slice(0, n + 2).map(o => fromAI(st.type, o));
}
function applyStage(p, st, items, replace) {
  if (replace) removeEnts(p, p.ents.filter(e => e.type === st.type && !e.locked));
  const names = new Set(p.ents.map(e => norm(e.name)));
  items.forEach((it, i) => { if (names.has(norm(it.name)) && st.type !== 'guia') it.name += ' (2)'; addEnt(p, st.type, it); names.add(norm(it.name)); });
  if (st.type === 'evento') p.ents.filter(e => e.type === 'evento').forEach((e, i) => { if (!e.orden) e.orden = i + 1; });
  resolveRels(p);
}
async function forge(ids, replace, extra) {
  const p = cur(); ui.busy = 'forge'; busy(1); let ok = 0;
  for (const id of ids) {
    const st = STAGES.find(s => s.id === id); ui.stageSt[id] = 'run'; render();
    try { const items = await genStage(p, st, extra); applyStage(p, st, items, replace); if (id === 'mundo' && /^(Mi primer universo|Universo nuevo)$/.test(p.name)) { const w = p.ents.find(e => e.type === 'mundo'); if (w && w.name !== 'Sin nombre') p.name = w.name; } ui.stageSt[id] = 'ok'; ok++; saveNow(); }
    catch (e) { ui.stageSt[id] = 'err:' + e.message; toast(e.message, 1); break; }
  }
  ui.busy = null; busy(0); render();
  if (ok === ids.length) toast('Universo forjado: ' + ok + ' etapa' + (ok > 1 ? 's' : '') + ' completada' + (ok > 1 ? 's' : ''));
}
async function regenEnt(id, instr) {
  const p = cur(), e = ent(id); if (!e || e.locked) return;
  ui.prev[id] = JSON.parse(JSON.stringify(e)); ui.busy = 'ent'; busy(1); renderDrawer();
  try {
    const cur0 = JSON.stringify({ nombre: e.name, resumen: e.summary, descripcion: e.body, secreto: e.secreto, fecha_texto: e.fecha, relaciones: relText(p, e) });
    const task = instr ? `Reescribe este elemento aplicando esta instrucción del máster: "${instr}". Conserva lo que la instrucción no afecte y no contradigas el canon.` : 'Propón una versión nueva y distinta de este elemento, coherente con el canon y con sus relaciones.';
    const user = `${ctxHead(p, { exclude: e.id })}\n\nELEMENTO ACTUAL (${TYPES[e.type].label}):\n${cur0}\n\nTAREA: ${task} Mantén el nombre salvo que la instrucción lo cambie. Devuelve SOLO un objeto JSON con este esquema:\n${SPEC[e.type].schema}`;
    let d = await aiJSON(sysBase(), user, 0.9); if (Array.isArray(d)) d = d[0] || {};
    if (d.items && d.items[0]) d = d.items[0];
    const n = fromAI(e.type, d);
    Object.assign(e, { name: n.name, summary: n.summary || e.summary, body: n.body || e.body, secreto: n.secreto || e.secreto, tags: n.tags.length ? n.tags : e.tags });
    if (e.type === 'evento') { e.fecha = n.fecha || e.fecha; e.orden = n.orden || e.orden; }
    if (n.rels.length) e.rels = n.rels;
    resolveRels(p); saveNow(); toast('Elemento actualizado');
  } catch (er) { delete ui.prev[id]; toast(er.message, 1); }
  ui.busy = null; busy(0); render(); renderDrawer();
}
async function addMore(type, n, extra) {
  const p = cur(); const st = Object.assign({}, STAGES.find(s => s.type === type));
  st.ask = m => `Añade ${m} elementos NUEVOS y distintos de los ya existentes a esta categoría, coherentes con el canon.`;
  ui.busy = 'more'; busy(1); render();
  try { const lockedN = 0; const user = `${ctxHead(p)}\n\nTAREA: ${st.ask(n)}${extra ? ' Instrucción: ' + extra : ''}\n\nDevuelve {"items":[...]} con exactamente ${n} elemento(s) con este esquema:\n${SPEC[type].schema}`; const d = await aiJSON(sysBase(), user, 0.95); const items = (d.items || (Array.isArray(d) ? d : [])).map(o => fromAI(type, o)); if (!items.length) throw new Error('La IA no devolvió elementos.'); applyStage(p, st, items, false); saveNow(); toast(items.length + ' elementos añadidos'); }
  catch (e) { toast(e.message, 1); }

}

// ---------- coherencia ----------
function localIssues(p) {
  const L = []; const add = (g, t, x, names, key) => L.push({ key, grav: g, titulo: t, texto: x, elementos: names || [], src: 'auto' });
  const seen = {};
  for (const e of p.ents) { const k = e.type + '|' + norm(e.name); if (e.type !== 'guia' && seen[k]) add('alta', 'Nombre duplicado: ' + e.name, 'Hay dos elementos del mismo tipo con el mismo nombre. Fusiona o renombra uno.', [e.name], 'dup|' + k); seen[k] = 1; }
  for (const e of p.ents) {
    for (const r of e.rels) if (!r.to) add('media', `"${e.name}" menciona a "${r.name}" pero no existe`, `La relación "${r.label} ${r.name}" apunta a algo que no está en el universo. Créalo o corrige la relación.`, [e.name], 'rel|' + e.id + '|' + norm(r.name));
    if (e.type === 'pnj' && !e.rels.some(r => r.to && ['faccion', 'lugar'].includes((ent(r.to) || {}).type))) add('baja', `${e.name} no está ligado a ningún lugar ni facción`, 'Un PNJ aislado es difícil de usar en mesa.', [e.name], 'iso|' + e.id);
    if (e.type === 'lugar' && !e.rels.length && !p.ents.some(o => o.rels.some(r => r.to === e.id))) add('baja', `${e.name} no tiene conexiones`, 'Nadie lo menciona ni lo conecta con otros lugares.', [e.name], 'orph|' + e.id);
    if (e.type === 'evento' && !e.fecha) add('baja', `El evento "${e.name}" no tiene fecha`, 'Sin fecha no se puede ordenar la cronología.', [e.name], 'nodate|' + e.id);
    if (!e.summary && e.type !== 'guia') add('baja', `"${e.name}" no tiene resumen`, 'Los resúmenes alimentan el contexto de la IA y la comprobación de coherencia.', [e.name], 'nosum|' + e.id);
  }
  const ev = p.ents.filter(e => e.type === 'evento'); const o = {}; ev.forEach(e => { if (e.orden) (o[e.orden] = o[e.orden] || []).push(e); });
  Object.values(o).forEach(a => { if (a.length > 1 && new Set(a.map(x => x.fecha)).size > 1) add('media', 'Eventos con el mismo orden pero fechas distintas', a.map(x => x.name + ' (' + x.fecha + ')').join(' / '), a.map(x => x.name), 'ord|' + a.map(x => x.id).join()); });
  if (!p.ents.some(e => e.type === 'mundo')) add('media', 'Falta la visión general del mundo', 'Genera o escribe el elemento "Mundo": da el tono a todo lo demás.', [], 'nomundo');
  p.misiones.forEach(m => { const d = ent(m.dador); if (d && /muert|desaparec/i.test(d.estado) && m.estado !== 'resuelta') add('media', `La misión "${m.titulo}" la da ${d.name}, que figura como ${d.estado}`, 'Revisa quién entrega la misión ahora.', [d.name], 'qdead|' + m.id); });
  return L.filter(i => !p.ignored.includes(i.key));
}
async function aiCheck() {

  ui.issuesBusy = true; busy(1); render();

    p.issues = L; p.issuesAt = Date.now(); saveNow(); toast(L.length ? L.length + ' posibles incoherencias' : 'La IA no ha encontrado contradicciones');

  <p class="mut sm" style="margin-top:14px">Los ajustes se pueden cambiar en cualquier momento: afectan a lo que generes a partir de ahora y a las regeneraciones.</p></div></div>

  <p class="mut sm">Las etapas marcadas reemplazan sus elementos <b>no bloqueados</b> (🔒 protege lo que ya te gusta). Cada etapa tarda unos segundos. La IA es gratuita y tiene cuota diaria.</p>
  ${err ? `<p style="color:var(--red)">⚠️ ${esc(String(err).slice(4))} <button class="btn sm" data-act="forge">Reintentar</button></p>` : ''}</div>`;
}

function card(p, e) {
  const nrel = e.rels.length;
  return `<div class="card hov" data-act="open" data-v="${e.id}"><div class="row spread"><span class="badge">${TYPES[e.type].icon} ${TYPES[e.type].label}</span><span>${e.locked ? '<span class="lock" title="Bloqueado">🔒</span>' : ''}</span></div><h3 class="h3" style="margin:8px 0 4px">${esc(e.name)}</h3>${e.fecha ? `<div class="mut sm">⏳ ${esc(e.fecha)}</div>` : ''}<p class="mut sm" style="margin:4px 0 8px">${esc(clip(e.summary || e.body, 150))}</p><div class="row">${e.tags.map(t => `<span class="badge v">${esc(t)}</span>`).join('')}${nrel ? `<span class="badge a">🔗 ${nrel}</span>` : ''}${e.estado ? `<span class="badge g">${esc(e.estado)}</span>` : ''}</div></div>`;
}
function vUniverso(p) {
  const types = WORLD_TYPES.concat(['mundo']);
  const list = p.ents.filter(e => e.type !== 'guia' && (ui.filter === 'all' || e.type === ui.filter) && (!ui.q || norm(e.name + ' ' + e.summary + ' ' + e.body + ' ' + e.tags.join(' ')).includes(norm(ui.q))));

  const chips = `<button class="chip ${ui.filter === 'all' ? 'on' : ''}" data-act="filter" data-v="all">Todo (${p.ents.filter(e => e.type !== 'guia').length})</button>` + ['mundo'].concat(WORLD_TYPES).map(t => `<button class="chip ${ui.filter === t ? 'on' : ''}" data-act="filter" data-v="${t}">${TYPES[t].icon} ${TYPES[t].plural.replace('Historia y cronología', 'Historia')} (${cnt(t)})</button>`).join('');
  const addT = ui.filter === 'all' ? 'lugar' : ui.filter;
  let body;
  if (!p.ents.filter(e => e.type !== 'guia').length) body = `<div class="empty"><div class="big">🌋</div><p>Aún no hay universo. Ve a <b>Forjar</b> para generarlo con IA, carga el ejemplo o crea elementos a mano.</p><button class="btn pri" data-act="tab" data-v="ajustes">⚒️ Ir a Forjar</button></div>`;
  else if (ui.mode === 'tl') {
    const ev = list.filter(e => e.type === 'evento').sort((a, b) => (a.orden || 0) - (b.orden || 0));
    body = ev.length ? `<div class="tl">${ev.map(e => `<div class="ev"><div class="card hov" data-act="open" data-v="${e.id}"><div class="row spread"><b style="color:var(--amber)">${esc(e.fecha || 'Sin fecha')}</b>${e.locked ? '🔒' : ''}</div><h3 class="h3">${esc(e.name)}</h3><p class="mut sm" style="margin:4px 0 0">${esc(clip(e.summary || e.body, 220))}</p></div></div>`).join('')}</div>` : '<div class="empty">No hay eventos que mostrar.</div>';
  } else body = list.length ? `<div class="grid">${list.map(e => card(p, e)).join('')}</div>` : '<div class="empty">Nada coincide con el filtro.</div>';
  return `<div class="row spread"><h2 class="h2">${esc(p.name)}</h2><div class="row"><button class="btn sm ${ui.mode === 'cards' ? 'pri' : ''}" data-act="mode" data-v="cards">Tarjetas</button><button class="btn sm ${ui.mode === 'tl' ? 'pri' : ''}" data-act="mode" data-v="tl">⏳ Cronología</button></div></div>
  <div class="row" style="margin:10px 0"><input id="q" style="max-width:300px" placeholder="🔎 Buscar…" value="${esc(ui.q)}"><button class="btn sm" data-act="newEnt" data-v="${addT}">＋ Nuevo ${esc(TYPES[addT].label.toLowerCase())}</button><button class="btn sm amb" data-act="more" data-v="${addT === 'mundo' ? 'lugar' : addT}" ${ui.busy ? 'disabled' : ''}>${ui.busy === 'more' ? '<span class="spin"></span>' : '✨'} Añadir 3 con IA</button></div>
  <div class="chips" style="margin-bottom:14px">${chips}</div>${body}`;
}
function vGuia(p) {

  ${w ? `<div class="card hov" data-act="open" data-v="${w.id}" style="margin:12px 0"><span class="badge">🌍 Mundo</span> ${w.locked ? '🔒' : ''}<h3 class="h2" style="margin-top:8px">${esc(w.name)}</h3><p class="mut" style="font-style:italic">${esc(w.summary)}</p><pre class="b">${esc(w.body)}</pre></div>` : ''}

function nm(id) { const e = ent(id); return e ? e.name : '—'; }
const optEnts = (p, types, sel, none) => `<option value="">${none || '—'}</option>` + p.ents.filter(e => types.includes(e.type)).map(e => `<option value="${e.id}" ${e.id === sel ? 'selected' : ''}>${esc(e.name)}</option>`).join('');

      (L.length ? `<div class="grid">${L.map(s => `<div class="card hov" data-act="openSes" data-v="${s.id}"><div class="row spread"><span class="badge a">Sesión ${s.num || '?'}</span><span class="badge ${s.estado === 'jugada' ? 'g' : ''}">${s.estado}</span></div><h3 class="h3" style="margin:8px 0 4px">${esc(s.titulo)}</h3><p class="mut sm">${esc(clip(s.resumen, 140))}</p><div class="mut sm">${s.fecha ? '📆 ' + esc(s.fecha) + ' · ' : ''}${(s.ents || []).length} elementos</div></div>`).join('')}</div>` : '<div class="empty"><div class="big">📅</div>Planifica tus sesiones: escenas, elementos del universo implicados y lo que pasó.</div>');

  } else {
    const L = p.ents.filter(e => ['pnj', 'lugar', 'faccion'].includes(e.type) && (ui.qfilter === 'all' || e.type === ui.qfilter));
    b = `<div class="chips" style="margin-bottom:12px">${[['all', 'Todos'], ['pnj', '🎭 PNJ'], ['lugar', '🗺️ Lugares'], ['faccion', '⚔️ Facciones']].map(([k, l]) => `<button class="chip ${ui.qfilter === k ? 'on' : ''}" data-act="qf" data-v="${k}">${l}</button>`).join('')}</div>` + (L.length ? `<div class="card">${L.map(e => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1;min-width:140px"><span class="link" data-act="open" data-v="${e.id}">${TYPES[e.type].icon} ${esc(e.name)}</span><div class="mut sm">${esc(clip(e.notasCamp, 80))}</div></span><select data-track="${e.id}" style="width:150px">${ESTADOS.map(s => `<option ${e.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select><span class="mut sm" style="width:90px">${p.sesiones.filter(s => (s.ents || []).includes(e.id)).length} sesiones</span></div>`).join('')}</div>` : '<div class="empty">Sin elementos que seguir.</div>');
  }
  return `<h2 class="h2">Gestor de campaña</h2><div class="sub">${sub.map(([k, l]) => `<button class="chip ${ui.sub === k ? 'on' : ''}" data-act="sub" data-v="${k}">${l}</button>`).join('')}</div>${b}`;
}
function vCoherencia(p) {
  const loc = localIssues(p); const all = loc.concat((p.issues || []).filter(i => !p.ignored.includes(i.key)));
  const ord = { alta: 0, media: 1, baja: 2 }; all.sort((a, b) => ord[a.grav] - ord[b.grav]);
  return `<h2 class="h2">Comprobador de coherencia</h2><p class="mut">Revisión automática de nombres, relaciones y fechas, más una revisión de continuidad con IA que lee todo el universo y busca contradicciones.</p>
  <div class="row"><button class="btn amb" data-act="aiCheck" ${ui.issuesBusy ? 'disabled' : ''}>${ui.issuesBusy ? '<span class="spin"></span> Revisando…' : '🧠 Revisar con IA'}</button>${p.issuesAt ? `<span class="mut sm">Última revisión IA: ${new Date(p.issuesAt).toLocaleString('es-ES')}</span>` : ''}</div>
  <div style="margin-top:14px">${all.length ? all.map((i, n) => `<div class="card iss ${i.grav}" style="margin-bottom:10px"><div class="row spread"><b>${esc(i.titulo)}</b><span class="badge ${i.grav === 'alta' ? 'r' : i.grav === 'media' ? 'a' : 'v'}">${i.grav}${i.src === 'ia' ? ' · IA' : ''}</span></div><p class="mut sm" style="margin:6px 0">${esc(i.texto)}</p>${i.sugerencia ? `<p class="sm">💡 ${esc(i.sugerencia)}</p>` : ''}<div class="row">${i.elementos.map(x => { const t = findByName(p, x); return t ? `<button class="btn sm" data-act="open" data-v="${t.id}">${TYPES[t.type].icon} ${esc(t.name)}</button>` : ''; }).join('')}${i.src === 'ia' && i.sugerencia ? `<button class="btn sm pri" data-act="fixIssue" data-v="${esc(i.key)}" ${ui.busy ? 'disabled' : ''}>✨ Arreglar con IA</button>` : ''}<button class="btn sm" data-act="ignoreIssue" data-v="${esc(i.key)}">Ignorar</button></div></div>`).join('') : '<div class="empty"><div class="big">✅</div>Sin incoherencias detectadas.</div>'}</div>`;

function vExportar(p) {
  const o = ui.exp || (ui.exp = { secretos: true, guia: true, campana: true });
  const n = p.ents.length;

  <h3 class="h3 sec">Importar</h3><div class="card"><input type="file" id="imp" accept=".json,application/json"><p class="mut sm">Importa un JSON exportado desde Forja de Mundos; se añade como universo nuevo, sin tocar los actuales.</p></div>
  <h3 class="h3 sec">Zona delicada</h3><div class="card"><button class="btn dan" data-act="delProject">🗑️ Eliminar este universo</button></div>`;

// ---------- cajón de edición ----------
function openDrawer(k, id) { ui.edit = { k, id }; renderDrawer(); $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); }
function closeDrawer() { ui.edit = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); render(); }
const fld = (f, lab, v, o) => { o = o || {}; return `<label>${lab}</label>` + (o.area ? `<textarea data-f="${f}" rows="${o.rows || 3}">${esc(v)}</textarea>` : `<input data-f="${f}" value="${esc(v)}">`); };
function renderDrawer() {
  const d = $('#drawer'); const p = cur(); if (!ui.edit) { d.innerHTML = ''; return; }
  const { k, id } = ui.edit; let h = '';
  if (k === 'ent') {
    const e = ent(id); if (!e) { d.innerHTML = ''; return; } const run = ui.busy === 'ent';
    const back = p.ents.filter(x => x.id !== e.id && x.rels.some(r => r.to === e.id));
    h = `<div class="row spread"><span class="badge">${TYPES[e.type].icon} ${TYPES[e.type].label}</span><div class="row"><button class="btn sm ${e.locked ? 'amb' : ''}" data-act="lock" title="Un elemento bloqueado no se regenera ni se reemplaza">${e.locked ? '🔒 Bloqueado' : '🔓 Bloquear'}</button><button class="btn sm" data-act="closeDrawer">✕</button></div></div>
    ${fld('name', 'Nombre', e.name)}${fld('summary', 'Resumen (1-2 frases)', e.summary, { area: 1, rows: 2 })}
    ${e.type === 'evento' ? `<div class="row"><div style="flex:2;min-width:160px">${fld('fecha', 'Fecha en el mundo', e.fecha)}</div><div style="flex:1;min-width:90px"><label>Orden</label><input data-f="orden" type="number" value="${e.orden || 0}"></div></div>` : ''}
    ${fld('body', 'Descripción', e.body, { area: 1, rows: 9 })}${e.type !== 'guia' ? fld('secreto', '🤫 Secretos (solo máster)', e.secreto, { area: 1, rows: 3 }) : ''}
    <label>Etiquetas (separadas por comas)</label><input data-f="tags" value="${esc(e.tags.join(', '))}">
    ${['pnj', 'lugar', 'faccion'].includes(e.type) ? `<div class="row"><div style="flex:1;min-width:140px"><label>Estado en la campaña</label><select data-f="estado">${ESTADOS.map(s => `<option ${e.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div><div style="flex:2;min-width:180px">${fld('notasCamp', 'Notas de campaña', e.notasCamp)}</div></div>` : ''}
    <label>Relaciones</label><div id="rels">${e.rels.map((r, i) => `<div class="rel"><span class="badge ${r.to ? '' : 'r'}">${esc(r.label)}</span>${r.to ? `<span class="link" data-act="open" data-v="${r.to}">${esc(relName(p, r))}</span>` : `<span style="color:var(--red)" title="No existe en el universo">${esc(r.name)} ⚠️</span>`}<button class="btn sm x" data-act="delRel" data-v="${i}">✕</button></div>`).join('') || '<span class="mut sm">Sin relaciones.</span>'}</div>
    <div class="row" style="margin-top:6px"><input id="rl" placeholder="tipo (aliado de, vive en…)" style="flex:1;min-width:120px"><select id="rt" style="flex:1;min-width:140px">${optEnts(p, ORDER.filter(t => t !== 'guia'), '', 'Elegir elemento…').replace(new RegExp(`<option value="${e.id}"[^>]*>[^<]*</option>`), '')}</select><button class="btn sm" data-act="addRel">＋</button></div>
    ${back.length ? `<label>Mencionado por</label><div class="chips">${back.map(x => `<span class="chip" data-act="open" data-v="${x.id}">${TYPES[x.type].icon} ${esc(x.name)}</span>`).join('')}</div>` : ''}
    <div class="card" style="margin-top:16px"><b>✨ Ajustar con IA</b><p class="mut sm" style="margin:4px 0 8px">${e.locked ? 'Está bloqueado: desbloquéalo para regenerarlo.' : 'Escribe qué cambiar o déjalo vacío para una versión nueva. La IA respeta el resto del universo.'}</p><input id="instr" placeholder="Ej.: hazlo más siniestro, que sea hermana de…" ${e.locked ? 'disabled' : ''}><div class="row" style="margin-top:8px"><button class="btn pri sm" data-act="regen" ${e.locked || ui.busy ? 'disabled' : ''}>${run ? '<span class="spin"></span> Generando…' : '✨ Regenerar'}</button>${ui.prev[e.id] ? '<button class="btn sm" data-act="undo">↩ Deshacer</button>' : ''}</div></div>
    <div class="row" style="margin-top:16px"><button class="btn sm" data-act="dup">⧉ Duplicar</button><button class="btn sm dan" data-act="delEnt">🗑️ Eliminar</button></div>`;
  } else if (k === 'ses') {
    const s = p.sesiones.find(x => x.id === id); if (!s) return;
    h = `<div class="row spread"><span class="badge a">Sesión</span><button class="btn sm" data-act="closeDrawer">✕</button></div>
    <div class="row"><div style="width:90px"><label>Nº</label><input data-f="num" type="number" value="${s.num || 1}"></div><div style="flex:1;min-width:150px">${fld('titulo', 'Título', s.titulo)}</div></div>
    <div class="row"><div style="flex:1;min-width:140px">${fld('fecha', 'Fecha', s.fecha)}</div><div style="flex:1;min-width:140px"><label>Estado</label><select data-f="estado">${['planificada', 'jugada'].map(x => `<option ${s.estado === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
    ${fld('resumen', 'Planteamiento', s.resumen, { area: 1, rows: 3 })}${fld('escenas', 'Escenas y notas del máster', s.escenas, { area: 1, rows: 9 })}${fld('resultado', 'Qué ocurrió (tras jugarla)', s.resultado, { area: 1, rows: 4 })}
    <label>Elementos del universo que aparecen</label><div class="chips" style="margin-bottom:6px">${(s.ents || []).map(i => `<span class="chip on">${esc(nm(i))} <span data-act="delSesEnt" data-v="${i}">✕</span></span>`).join('') || '<span class="mut sm">Ninguno</span>'}</div>
    <select id="sesAdd"><option value="">＋ Añadir elemento…</option>${p.ents.filter(e => !['guia', 'mundo'].includes(e.type) && !(s.ents || []).includes(e.id)).map(e => `<option value="${e.id}">${TYPES[e.type].icon} ${esc(e.name)}</option>`).join('')}</select>
    <div class="row" style="margin-top:16px"><button class="btn sm dan" data-act="delSes">🗑️ Eliminar</button></div>`;
  } else {
    const m = p.misiones.find(x => x.id === id); if (!m) return;
    h = `<div class="row spread"><span class="badge a">🎯 Misión</span><button class="btn sm" data-act="closeDrawer">✕</button></div>
    ${fld('titulo', 'Título', m.titulo)}<label>Estado</label><select data-f="estado">${QEST.map(([k2, l]) => `<option value="${k2}" ${m.estado === k2 ? 'selected' : ''}>${l.replace(/s$/, '').replace('Pendiente', 'Pendiente')}</option>`).join('')}</select>
    <div class="row"><div style="flex:1;min-width:150px"><label>Quién la da</label><select data-f="dador">${optEnts(p, ['pnj', 'faccion'], m.dador)}</select></div><div style="flex:1;min-width:150px"><label>Dónde</label><select data-f="lugar">${optEnts(p, ['lugar'], m.lugar)}</select></div></div>
    ${fld('objetivo', 'Objetivo', m.objetivo, { area: 1, rows: 3 })}${fld('recompensa', 'Recompensa', m.recompensa)}${fld('notas', 'Notas', m.notas, { area: 1, rows: 4 })}
    <div class="row" style="margin-top:16px"><button class="btn sm dan" data-act="delQuest">🗑️ Eliminar</button></div>`;
  }
  d.innerHTML = h;
}

// ================= BANDA SONORA (WebAudio, todo sintetizado) =================

  const d = JSON.parse(txt); const q = d && d.app === 'forja-de-mundos' ? d.proyecto : d; if (!q || !Array.isArray(q.ents)) throw new Error('El archivo no parece un universo de Forja de Mundos.');
  const p = Object.assign(newProject(q.name), q, { id: uid() }); p.name = (q.name || 'Universo') + ' (importado)';
  p.ents = q.ents.map(e => Object.assign({ id: uid(), type: 'lugar', name: 'Sin nombre', summary: '', body: '', secreto: '', tags: [], fecha: '', orden: 0, rels: [], locked: false, estado: '', notasCamp: '' }, e)).filter(e => TYPES[e.type]);
  p.ents.forEach(e => { e.rels = (Array.isArray(e.rels) ? e.rels : []).map(r => ({ to: r.to || null, name: str(r.name), label: str(r.label) })); });
  p.ajustes = Object.assign(newProject().ajustes, q.ajustes || {}); p.sesiones = q.sesiones || []; p.misiones = q.misiones || []; p.issues = q.issues || []; p.ignored = q.ignored || [];
  DB.projects.push(p); DB.currentId = p.id; resolveRels(p); saveNow(); return p;
}

// ---------- universo de ejemplo ----------
function loadExample() {

  const E = (type, name, summary, body, secreto, rels, x) => { const e = addEnt(p, type, Object.assign({ name, summary, body, secreto: secreto || '' }, x || {})); (rels || []).forEach(r => addRel(e, r[0], r[1])); return e; };
  E('mundo', 'Las Islas Cenicientas', 'Doce islas de ceniza y mar sobre un volcán dormido.', 'Un archipiélago de doce islas nacidas de la ceniza de un volcán que lleva trescientos años dormido. Sus gentes viven del comercio, la pesca y la Brasa, una magia que arde dentro de quien la usa y le cuesta un recuerdo cada vez. La luz de los faros mantiene alejada la Niebla Gris que cubre el mar abierto.\n\nPrincipios del mundo: la magia siempre cuesta memoria; la luz es poder; nadie recuerda cómo era el mundo antes del Apagón.', 'El volcán no duerme: se alimenta de los recuerdos que se pierden con cada conjuro.', []);
  E('lugar', 'Puerto Hueco', 'Capital del archipiélago, construida dentro de la caldera.', 'Ciudad escalonada en el cráter hundido, con calles de piedra negra y cientos de faroles de cristal. Aquí se juntan mercaderes, nobles y faroleros. El aire huele a azufre y a pescado ahumado.', 'Bajo el mercado central hay una galería que baja hasta el corazón del volcán.', [], { tags: ['ciudad'] });
  E('lugar', 'Isla de Humo', 'Isla-monasterio con el faro más antiguo.', 'Roca humeante coronada por el Faro Primero, cuya llama nunca se ha apagado. Los monjes de la Última Llama guardan sus archivos de recuerdos.', 'El faro funciona con recuerdos robados a peregrinos.', [['Puerto Hueco', 'a un día de navegación de']], { tags: ['templo'] });
  E('lugar', 'Las Fraguas Sumergidas', 'Ruinas de la ciudad que se hundió con el Apagón.', 'Torres de metal negro bajo aguas poco profundas, visibles con marea baja. Quien entra vuelve con objetos extraños y con huecos en la memoria.', 'Las Fraguas fabricaban Brasas Madre, el origen de toda la magia actual.', [['Puerto Hueco', 'a media jornada de']], { tags: ['ruina'] });
  E('evento', 'El Apagón del Mar', 'Todas las luces del mundo antiguo se apagaron a la vez.', 'Durante una noche, la magia y las luces del mundo antiguo se extinguieron y la Niebla Gris cubrió el mar. Nadie recuerda la causa.', 'Fue un sacrificio deliberado de las Fraguas para contener al volcán.', [['Las Fraguas Sumergidas', 'implica a']], { fecha: 'Año -300', orden: 1 });
  E('evento', 'La Fundación de Puerto Hueco', 'Los supervivientes encienden el primer faro en la caldera.', 'Los supervivientes del Apagón fundan la ciudad en la caldera y encienden el primer farol. Empieza el calendario actual.', '', [['Puerto Hueco', 'implica a']], { fecha: 'Año 0', orden: 2 });
  E('evento', 'El Hundimiento de las Fraguas', 'Las Fraguas se hunden bajo el mar.', 'Tras una revuelta, las Fraguas desaparecen bajo las olas. Los gremios se reparten su legado.', '', [['Las Fraguas Sumergidas', 'implica a']], { fecha: 'Año 214', orden: 3 });
  E('faccion', 'Gremio de Faroleros', 'Guardianes de la luz que mantiene a raya la Niebla.', 'Gremio popular que mantiene los faroles y faros del archipiélago. Gozan del respeto del pueblo y de la desconfianza de los nobles.\n\nObjetivos: mantener la luz encendida y su independencia.', 'Ocultan que el aceite de los faroles se está agotando.', [['Puerto Hueco', 'con sede en'], ['Casa Ceniza', 'rival de']], { tags: ['gremio'] });
  E('faccion', 'Casa Ceniza', 'Familia noble que gobierna Puerto Hueco.', 'Linaje que se dice descendiente de los fundadores. Controla el puerto y los impuestos.\n\nObjetivos: controlar el suministro de aceite y de Brasa.', 'Financian expediciones ilegales a las Fraguas.', [['Puerto Hueco', 'con sede en'], ['Gremio de Faroleros', 'rival de']], { tags: ['familia'] });
  E('pnj', 'Ilsa Marrón', 'Farolera mayor de Puerto Hueco, terca y generosa.', 'Mujer de cuarenta años, manos quemadas y voz ronca. Habla poco y mide mucho.\n\nPersonalidad: leal, desconfiada con los nobles.\n\nMotivación: salvar la luz de los faros.', 'Ha olvidado a su hijo por abusar de la Brasa y no lo sabe.', [['Gremio de Faroleros', 'miembro de'], ['Puerto Hueco', 'se encuentra en'], ['Don Aurelio Ceniza', 'rival de']], { tags: ['farolera'] });

  E('gancho', 'El farol que se apagó solo', 'Un farol del puerto se apaga y deja un vacío en la memoria de quienes lo miran.', 'Ilsa Marrón contrata a los jugadores para investigar un farol que se apagó sin aceite ni viento.\n\nComplicación: alguien ha manipulado la llama.\n\nRecompensa: la gratitud del Gremio y un favor de Ilsa.', 'Fue una prueba de un aparato robado a las Fraguas.', [['Ilsa Marrón', 'implica a'], ['Puerto Hueco', 'ocurre en'], ['La disputa por el aceite', 'parte del conflicto']]);
  E('guia', 'Cómo usar este universo', '', 'Empieza en Puerto Hueco con el gancho del farol apagado. Presenta la Brasa pronto y haz que el primer conjuro de un PNJ cueste un recuerdo visible. Mantén el misterio del volcán hasta la segunda mitad de la campaña.', '');
  E('guia', 'Tono y estilo de narración', '', 'Narra con olor a azufre y luz de farol. El tono es melancólico con destellos de esperanza: la pérdida de memoria es el tema central. Usa pausas y silencios cuando alguien olvida algo.', '');
  p.ents.filter(e => e.type === 'guia').forEach(e => e.summary = clip(e.body, 140));
  p.sesiones.push({ id: uid(), num: 1, titulo: 'El farol que se apagó solo', fecha: '', estado: 'planificada', resumen: 'Los jugadores llegan a Puerto Hueco y Ilsa Marrón les pide ayuda.', escenas: '1. Llegada al puerto y encuentro con Ilsa.\n2. Inspección del farol apagado.\n3. Primera señal de la Casa Ceniza.', resultado: '', ents: [p.ents.find(e => e.name === 'Ilsa Marrón').id, p.ents.find(e => e.name === 'Puerto Hueco').id] });
  p.misiones.push({ id: uid(), titulo: 'Investigar el farol apagado', estado: 'activa', dador: p.ents.find(e => e.name === 'Ilsa Marrón').id, lugar: p.ents.find(e => e.name === 'Puerto Hueco').id, objetivo: 'Descubrir por qué se apagó el farol de la plaza del puerto.', recompensa: 'Un favor de Ilsa Marrón', notas: '' });
  resolveRels(p); saveNow(); ui.tab = 'universo'; render(); toast('Universo de ejemplo cargado');
}

// ---------- eventos ----------
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, v = t.dataset.v, p = cur();
  const done = () => { saveNow(); render(); };
  switch (a) {
    case 'tab': ui.tab = v; render(); window.scrollTo(0, 0); break;
    case 'filter': ui.filter = v; render(); break;
    case 'mode': ui.mode = v; if (v === 'tl') ui.filter = 'evento'; render(); break;
    case 'sub': ui.sub = v; render(); break;
    case 'qf': ui.qfilter = v; render(); break;
    case 'open': openDrawer('ent', v); break;
    case 'openSes': openDrawer('ses', v); break;
    case 'openQuest': openDrawer('mis', v); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'newProject': { const n = prompt('Nombre del nuevo universo', 'Universo nuevo'); if (n === null) break; const q = newProject(n.trim() || 'Universo nuevo'); DB.projects.push(q); DB.currentId = q.id; ui.tab = 'ajustes'; ui.stageSt = {}; done(); break; }
    case 'surprise': p.premise = PREMISAS[Math.floor(Math.random() * PREMISAS.length)]; done(); break;
    case 'tema': { const L = p.ajustes.temas; const i = L.indexOf(v); if (i >= 0) L.splice(i, 1); else L.push(v); done(); break; }
    case 'forge': {
      const ids = [...document.querySelectorAll('[data-stage]')].filter(x => x.checked).map(x => x.dataset.stage); if (!ids.length) { toast('Marca al menos una etapa.', 1); break; }
      const has = p.ents.some(e => ids.some(i => STAGES.find(s => s.id === i).type === e.type && !e.locked)); if (has && !confirm('Las etapas marcadas reemplazarán sus elementos no bloqueados. ¿Continuar?')) break;
      ids.forEach(i => delete ui.stageSt[i]); const extra = ($('#extra') || {}).value || ''; await forge(ids, true, extra.trim()); break;
    }
    case 'example': loadExample(); break;
    case 'newEnt': { if (v === 'mundo' && p.ents.some(e => e.type === 'mundo')) { openDrawer('ent', p.ents.find(e => e.type === 'mundo').id); break; } const e = addEnt(p, v, { name: 'Nuevo ' + TYPES[v].label.toLowerCase() }); done(); openDrawer('ent', e.id); break; }
    case 'more': await addMore(v, 3, ''); break;
    case 'regenGuide': await forge(['guia'], true, ''); break;
    case 'regen': await regenEnt(ui.edit.id, ($('#instr') || {}).value.trim()); break;
    case 'undo': { const pv = ui.prev[ui.edit.id]; const e = ent(ui.edit.id); if (pv && e) { Object.assign(e, pv); delete ui.prev[e.id]; done(); renderDrawer(); } break; }
    case 'lock': { const e = ent(ui.edit.id); e.locked = !e.locked; done(); renderDrawer(); break; }
    case 'dup': { const e = ent(ui.edit.id); const c = addEnt(p, e.type, JSON.parse(JSON.stringify(Object.assign({}, e, { id: undefined, locked: false, name: e.name + ' (copia)' })))); done(); openDrawer('ent', c.id); break; }
    case 'delEnt': { const e = ent(ui.edit.id); if (!confirm('¿Eliminar "' + e.name + '"? Las relaciones que lo mencionan quedarán marcadas como rotas.')) break; removeEnts(p, [e]); ui.edit = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); done(); break; }
    case 'addRel': { const e = ent(ui.edit.id); const to = $('#rt').value; if (!to) { toast('Elige con qué elemento se relaciona.', 1); break; } const tg = ent(to); e.rels.push({ to, name: tg.name, label: $('#rl').value.trim() || 'relacionado con' }); saveNow(); renderDrawer(); break; }
    case 'delRel': { const e = ent(ui.edit.id); e.rels.splice(Number(v), 1); saveNow(); renderDrawer(); break; }
    case 'newSes': { const s = { id: uid(), num: Math.max(0, ...p.sesiones.map(x => x.num || 0)) + 1, titulo: 'Nueva sesión', fecha: '', estado: 'planificada', resumen: '', escenas: '', resultado: '', ents: [] }; p.sesiones.push(s); done(); openDrawer('ses', s.id); break; }
    case 'aiSes': await aiSes(); break;
    case 'delSes': if (confirm('¿Eliminar la sesión?')) { p.sesiones = p.sesiones.filter(s => s.id !== ui.edit.id); closeDrawer(); saveNow(); } break;
    case 'delSesEnt': { const s = p.sesiones.find(x => x.id === ui.edit.id); s.ents = s.ents.filter(i => i !== v); saveNow(); renderDrawer(); break; }
    case 'newQuest': { const m = { id: uid(), titulo: 'Nueva misión', estado: 'pendiente', dador: '', lugar: '', objetivo: '', recompensa: '', notas: '' }; p.misiones.push(m); done(); openDrawer('mis', m.id); break; }
    case 'questFromHook': { ui.hookPick = !ui.hookPick; render(); break; }
    case 'aiQuest': await aiQuest(); break;
    case 'delQuest': if (confirm('¿Eliminar la misión?')) { p.misiones = p.misiones.filter(s => s.id !== ui.edit.id); closeDrawer(); saveNow(); } break;
    case 'aiCheck': await aiCheck(); break;
    case 'ignoreIssue': p.ignored.push(v); p.issues = (p.issues || []).filter(i => i.key !== v); done(); break;
    case 'fixIssue': { const i = (p.issues || []).find(x => x.key === v); const e = i && i.elementos.map(n => findByName(p, n)).find(x => x && !x.locked); if (!e) { toast('Los elementos implicados están bloqueados o no existen.', 1); break; } await regenEnt(e.id, 'Corrige esta incoherencia detectada: ' + i.titulo + '. ' + i.texto + ' Sugerencia: ' + i.sugerencia); p.issues = p.issues.filter(x => x.key !== v); done(); toast('Corregido "' + e.name + '". Revisa el resultado y vuelve a comprobar.'); break; }
    case 'exPdf': try { busy(1); const d = await buildPdf(p, expOpts()); d.save(slug(p.name) + '.pdf'); toast('PDF generado'); } catch (e) { toast(e.message, 1); } busy(0); break;
    case 'exMd': download(slug(p.name) + '.md', new Blob([toMarkdown(p, expOpts())], { type: 'text/markdown;charset=utf-8' })); toast('Markdown descargado'); break;
    case 'exJson': download(slug(p.name) + '.json', new Blob([exportJSON(p)], { type: 'application/json' })); toast('JSON descargado'); break;
    case 'delProject': if (confirm('¿Eliminar "' + p.name + '" para siempre? Exporta antes un JSON si quieres conservarlo.')) { DB.projects = DB.projects.filter(x => x.id !== p.id); if (!DB.projects.length) DB.projects.push(newProject('Mi primer universo')); DB.currentId = DB.projects[0].id; ui.tab = 'ajustes'; done(); } break;
  }
});
function onField(t) {
  const p = cur(); let tgt;
  if (t.dataset.f && ui.edit) { const k = ui.edit.k; tgt = k === 'ent' ? ent(ui.edit.id) : k === 'ses' ? p.sesiones.find(x => x.id === ui.edit.id) : p.misiones.find(x => x.id === ui.edit.id); const f = t.dataset.f; if (!tgt) return; if (f === 'tags') tgt.tags = t.value.split(',').map(s => s.trim()).filter(Boolean); else if (f === 'orden' || f === 'num') tgt[f] = Number(t.value) || 0; else tgt[f] = t.value; save(); return; }
  if (t.dataset.proj) { p[t.dataset.proj] = t.value; save(); if (t.dataset.proj === 'name') { $('#projSel').selectedOptions[0].textContent = t.value; } return; }
  if (t.dataset.aj) { p.ajustes[t.dataset.aj] = t.value; save(); return; }
  if (t.dataset.slider) { p.ajustes[t.dataset.slider] = Number(t.value); updSliders(); save(); return; }
}
function updSliders() { const p = cur(), a = p.ajustes; const M = { tono: L_TONO, magia: L_MAGIA, tecnologia: L_TEC, crudeza: L_CRU }; for (const k in M) { const el = $('#v-' + k); if (el) el.textContent = band(a[k], M[k]); } }
document.addEventListener('input', ev => { const t = ev.target; if (t.id === 'q') { ui.q = t.value; const pos = t.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; } onField(t); });
document.addEventListener('change', async ev => {
  const t = ev.target, p = cur();
  if (t.id === 'projSel') { DB.currentId = t.value; ui.stageSt = {}; ui.edit = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); saveNow(); render(); return; }
  if (t.dataset.stage) { ui.sel = ui.sel || {}; ui.sel[t.dataset.stage] = t.checked; return; }
  if (t.dataset.track) { const e = ent(t.dataset.track); e.estado = t.value; saveNow(); return; }
  if (t.id === 'sesAdd' && t.value) { const s = p.sesiones.find(x => x.id === ui.edit.id); s.ents = (s.ents || []).concat(t.value); saveNow(); renderDrawer(); return; }
  if (t.id === 'hookSel' && t.value) { const g = ent(t.value); const pn = g.rels.find(r => r.to && (ent(r.to) || {}).type === 'pnj'), lu = g.rels.find(r => r.to && (ent(r.to) || {}).type === 'lugar'); p.misiones.push({ id: uid(), titulo: g.name, estado: 'pendiente', dador: pn ? pn.to : '', lugar: lu ? lu.to : '', objetivo: g.summary || g.body, recompensa: '', notas: g.body }); ui.hookPick = false; saveNow(); render(); toast('Misión creada desde el gancho'); return; }
  if (t.id === 'o-sec' || t.id === 'o-gui' || t.id === 'o-cam') { ui.exp = { secretos: $('#o-sec').checked, guia: $('#o-gui').checked, campana: $('#o-cam').checked }; return; }
  if (t.id === 'imp' && t.files[0]) { try { const q = importJSON(await t.files[0].text()); toast('Importado: ' + q.name); ui.tab = 'universo'; render(); } catch (e) { toast(e.message || 'No se pudo importar.', 1); } return; }
  if (t.dataset.f || t.dataset.aj || t.dataset.proj) onField(t);
});
// selector de gancho en misiones
const _vc = vCampana; vCampana = function (p) { let h = _vc(p); if (ui.tab === 'campana' && ui.sub === 'misiones' && ui.hookPick) { const g = p.ents.filter(e => e.type === 'gancho'); h = h.replace('<div class="kan">', `<div class="card" style="margin-bottom:12px"><label>Elige el gancho que quieres convertir en misión</label><select id="hookSel"><option value="">—</option>${g.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>${g.length ? '' : '<p class="mut sm">Aún no hay ganchos.</p>'}</div><div class="kan">`); } return h; };

// ---------- inicio ----------
function init() {
  load();
  const R = $('#runes'); const g = ['✦', '◈', '⟡', '☉', '✧', '⌘']; for (let i = 0; i < 12; i++) { const s = document.createElement('i'); s.textContent = g[i % g.length]; s.style.left = (Math.random() * 100) + '%'; s.style.animationDuration = (18 + Math.random() * 22) + 's'; s.style.animationDelay = (-Math.random() * 30) + 's'; s.style.fontSize = (14 + Math.random() * 20) + 'px'; R.appendChild(s); }
  if (cur().ents.length) ui.tab = 'universo';
  render(); updSliders(); initMusicUI();
  window.__forja = { renderMood, wavBytes, Engine, MOODS, MU, DB: () => DB, cur, buildPdf, toMarkdown, exportJSON, importJSON, loadExample, localIssues, expOpts };
}
const _r = render; render = function () { _r(); updSliders(); };
init();
